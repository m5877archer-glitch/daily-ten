<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10Everyday.com</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="3;url=https://10everyday.com/work.html">
<style>
  :root{--ink:#1c2733;--paper:#f7f4ec;--pt:#5b8c5b;--ptdark:#1e3a1e;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:Georgia,'Times New Roman',serif;background:var(--pt);color:var(--ink);
       min-height:100vh;display:flex;justify-content:center;padding:24px 16px 48px;}
  .page{background:var(--paper);border:1px solid var(--ptdark);padding:34px 22px 28px;
        box-shadow:0 3px 14px rgba(20,40,20,.35);width:100%;max-width:640px;text-align:center;}
  .kicker{font-size:.7rem;letter-spacing:.25em;text-transform:uppercase;color:#6b6455;}
  h1{font-size:clamp(1.55rem,8.5vw,2.5rem);letter-spacing:.02em;margin:2px 0;}
  h1 .dot{color:#b23a48;}
  .tagline{font-style:italic;color:#524b3e;font-size:.9rem;border-bottom:3px double var(--ink);
           padding-bottom:12px;margin-bottom:18px;}
  .status{font-size:.95rem;color:#524b3e;}
  .status a{color:var(--ptdark);}
  .byline{margin-top:22px;font-size:.72rem;color:#6b6455;font-style:italic;}
</style>
</head>
<body>
<div class="page">
  <div class="kicker">Ten Questions, Every Weekday</div>
  <h1>10Everyday<span class="dot">.</span>com</h1>
  <div class="tagline">The news quiz that takes two minutes.</div>
  <div class="status">Loading... <a href="https://10everyday.com/work.html">tap here</a> if nothing happens.</div>
  <div class="byline">10Everyday is edited in San Marcos, California</div>
</div>
<script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "19de40f2795749c7beea08f80745705b"}'></script>
<script>
  setTimeout(function () {
    window.location.replace("https://10everyday.com/work.html");
  }, 600);
</script>
</body>
</html>
