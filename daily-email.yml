name: Daily email

# The old version tried to be running at the moment the email should go out.
# That does not work: GitHub queues scheduled jobs and has been delaying these
# by four to five hours, which blew past the cutoff every single day.
#
# This version does not care when it runs. It figures out the next weekday
# 6:00 AM Pacific send, hands Kit a broadcast scheduled for that exact moment,
# and lets Kit do the sending. Any run that happens before that moment works.
# Runs start the evening before, so there are seven chances to land one.

on:
  schedule:
    - cron: '17 2 * * *'    # ~7:17 PM Pacific, previous evening
    - cron: '17 4 * * *'    # ~9:17 PM Pacific
    - cron: '17 6 * * *'    # ~11:17 PM Pacific
    - cron: '17 8 * * *'    # ~1:17 AM Pacific
    - cron: '17 10 * * *'   # ~3:17 AM Pacific
    - cron: '17 11 * * *'   # ~4:17 AM Pacific
    - cron: '47 12 * * *'   # ~5:47 AM Pacific, last chance
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo
        uses: actions/checkout@v4

      - name: Schedule the next broadcast in Kit
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          API = "https://api.kit.com/v4/broadcasts"
          SEND_HOUR = 6   # Pacific. Change this one number to move the send time.
          PT = ZoneInfo("America/Los_Angeles")

          key = os.environ.get("KIT_API_KEY", "").strip()
          if not key:
              sys.exit("No KIT_API_KEY secret found. Repo Settings, Secrets and variables, Actions.")

          headers = {"Content-Type": "application/json", "X-Kit-Api-Key": key}
          now = datetime.now(PT)

          # Find the next weekday send that has not happened yet.
          target = now.replace(hour=SEND_HOUR, minute=0, second=0, microsecond=0)
          if now >= target:
              target += timedelta(days=1)
          while target.weekday() > 4:          # 5 = Saturday, 6 = Sunday
              target += timedelta(days=1)

          filename = "quiz-" + target.strftime("%B").lower() + "-" + str(target.day) + ".html"
          subject = "10Everyday, " + target.strftime("%A %B ") + str(target.day)

          print("Now:      " + now.isoformat())
          print("Next send: " + target.isoformat())
          print("Looking for: " + filename)

          if not os.path.exists(filename):
              print("Not in the repo yet. Skipping so nobody gets a link to a stale quiz.")
              print("A later run today will pick it up once the file is pushed.")
              sys.exit(0)
          print("Found it.")

          # Do not schedule the same morning twice. Covers duplicate crons,
          # manual dispatches, and the fact that seven runs cover one send.
          try:
              req = urllib.request.Request(API + "?per_page=100", headers=headers, method="GET")
              with urllib.request.urlopen(req, timeout=30) as r:
                  existing = json.loads(r.read().decode("utf-8")).get("broadcasts", [])
              if any((b.get("subject") or "").strip() == subject for b in existing):
                  print("'" + subject + "' is already scheduled in Kit. Nothing to do.")
                  sys.exit(0)
              print("No broadcast for that morning yet. Creating one.")
          except Exception as e:
              print("WARNING: could not check existing broadcasts (" + str(e) + ").")
              print("Proceeding anyway. If the list gets this twice, that is why.")

          # If we somehow landed inside the last few minutes before the send,
          # give Kit a small cushion rather than handing it a past timestamp.
          send_at = target
          if (target - now) < timedelta(minutes=5):
              send_at = now + timedelta(minutes=5)
              print("Cutting it close. Scheduling for " + send_at.isoformat() + " instead.")

          content = (
              '<p><a href="https://10everyday.com/e">https://10everyday.com/e</a></p>'
              '<p>Ten questions. About three minutes.</p>'
              '<p>Matt</p>'
          )

          payload = {
              "subject": subject,
              "content": content,
              "description": "Daily automated send",
              "public": True,
              "send_at": send_at.isoformat(),
          }

          req = urllib.request.Request(
              API,
              data=json.dumps(payload).encode("utf-8"),
              headers=headers,
              method="POST",
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = json.loads(r.read().decode("utf-8"))
                  bid = body.get("broadcast", {}).get("id")
                  print("Scheduled. Subject: " + subject)
                  print("Sends at:  " + send_at.isoformat())
                  print("Kit id:    " + str(bid))
          except urllib.error.HTTPError as e:
              print("Kit returned an error: " + str(e.code))
              print(e.read().decode("utf-8"))
              sys.exit(1)
          PY
