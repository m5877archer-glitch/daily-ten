<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10Everyday.com</title>
<style>
  :root{
    --ink:#1c2733;
    --paper:#f7f4ec;
    --pt:#5b8c5b;
    --ptdark:#1e3a1e;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:Georgia,'Times New Roman',serif;
    background:var(--pt);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 16px 48px;
  }
  .page{
    background:var(--paper);border:1px solid var(--ptdark);
    padding:34px 22px 28px;box-shadow:0 3px 14px rgba(20,40,20,.35);
    width:100%;max-width:640px;text-align:center;
  }
  .kicker{font-size:.7rem;letter-spacing:.25em;text-transform:uppercase;color:#6b6455;}
  h1{font-size:clamp(1.55rem,8.5vw,2.5rem);letter-spacing:.02em;margin:2px 0;}
  h1 .dot{color:#b23a48;}
  .tagline{
    font-style:italic;color:#524b3e;font-size:.9rem;
    border-bottom:3px double var(--ink);padding-bottom:12px;margin-bottom:18px;
  }
  .status{font-size:.95rem;color:#524b3e;}
  .status a{color:var(--ptdark);}
  .byline{margin-top:22px;font-size:.72rem;color:#6b6455;font-style:italic;}
</style>
</head>
<body>
<div class="page">
  <div class="kicker">Ten Questions, Every Weekday</div>
  <h1>10Everyday<span class="dot">.</span>com</h1>
  <div class="tagline">The news quiz that takes two minutes.</div>
  <div class="status" id="status">Loading today's edition...</div>
  <noscript>
    <div class="status">This quiz needs JavaScript turned on. You can browse past editions in the <a href="archive.html">archive</a>.</div>
  </noscript>
  <div class="byline">10Everyday is edited in San Marcos, California</div>
</div>

<script>
(function () {
  var MONTHS = ["january","february","march","april","may","june","july","august",
                "september","october","november","december"];
  var LOOKBACK = 8;

  function pacificToday() {
    var s = new Date().toLocaleDateString("en-CA", { timeZone: "America/Los_Angeles" });
    var p = s.split("-");
    return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
  }

  function fileFor(d) {
    return "quiz-" + MONTHS[d.getUTCMonth()] + "-" + d.getUTCDate() + ".html";
  }

  function render(html) {
    document.open();
    document.write(html);
    document.close();
  }

  function fail() {
    var el = document.getElementById("status");
    if (el) {
      el.innerHTML = "Today's edition is not up yet. Try the <a href=\"archive.html\">archive</a> in the meantime.";
    }
  }

  function attempt(day, tries) {
    if (tries > LOOKBACK) { fail(); return; }
    fetch(fileFor(day) + "?v=" + Date.now(), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) { throw new Error("missing"); }
        return r.text();
      })
      .then(function (html) {
        if (html.indexOf("EDITION_DATE") === -1) { throw new Error("not an edition"); }
        render(html);
      })
      .catch(function () {
        var prev = new Date(day.getTime() - 86400000);
        attempt(prev, tries + 1);
      });
  }

  attempt(pacificToday(), 1);
})();
</script>
</body>
</html>
