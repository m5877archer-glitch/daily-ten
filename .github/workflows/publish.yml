name: Publish nightly edition

on:
  schedule:
    # Times are UTC. 06:05 UTC = 2:05 AM Eastern (EDT).
    # Off-the-hour minutes get scheduled sooner than :00 slots.
    # Second run (4:05 AM Eastern) is a safety net in case the first is dropped.
    # In November, when clocks fall back, change 6 to 7 and 8 to 9.
    - cron: '5 6 * * *'
    - cron: '5 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Copy today's dated edition to index.html
        run: |
          TODAY=$(TZ="America/New_York" date +'%B-%-d' | tr '[:upper:]' '[:lower:]')
          FILE="quiz-${TODAY}.html"
          echo "Looking for $FILE"
          if [ -f "$FILE" ]; then
            cp "$FILE" index.html
            echo "Published $FILE as index.html"
          else
            echo "No file named $FILE found. Skipping."
            exit 0
          fi

      - name: Commit and push if index.html changed
        run: |
          git config user.name "nightly-bot"
          git config user.email "nightly-bot@users.noreply.github.com"
          if git diff --quiet index.html; then
            echo "index.html unchanged."
          else
            git add index.html
            git commit -m "Auto-publish nightly edition"
            git push
          fi

