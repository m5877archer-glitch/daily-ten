name: Daily email

on:
  schedule:
    # 07:23 UTC = 12:23 AM Pacific in summer, 11:23 PM Pacific in winter.
    # Deliberately off the hour: GitHub queues scheduled runs, and the top
    # of the hour is the most congested slot. Running this early gives
    # about five and a half hours of slack before the 6:00 AM Pacific send.
    - cron: '23 7 * * 1-5'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo
        uses: actions/checkout@v4

      - name: Schedule today's broadcast in Kit
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          API = "https://api.kit.com/v4/broadcasts"
          TARGET_HOUR = 6   # normal send time, Pacific
          CUTOFF_HOUR = 8   # past this, skip the day rather than send at a weird hour

          key = os.environ.get("KIT_API_KEY", "").strip()
          if not key:
              sys.exit("No KIT_API_KEY secret found. Add it in repo Settings, Secrets and variables, Actions.")

          headers = {"Content-Type": "application/json", "X-Kit-Api-Key": key}
          now = datetime.now(ZoneInfo("America/Los_Angeles"))

          # Today's quiz file, same naming pattern the site uses.
          filename = "quiz-" + now.strftime("%B").lower() + "-" + str(now.day) + ".html"
          if not os.path.exists(filename):
              print("No " + filename + " in the repo. Skipping today's email so nobody gets sent a stale quiz.")
              sys.exit(0)
          print("Found " + filename + ". Proceeding.")

          subject = "10Everyday, " + now.strftime("%A %B ") + str(now.day)

          # Work out when this should go out.
          target = now.replace(hour=TARGET_HOUR, minute=0, second=0, microsecond=0)
          cutoff = now.replace(hour=CUTOFF_HOUR, minute=0, second=0, microsecond=0)

          if now < target:
              send_at = target.isoformat()
              print("On time. Scheduling for " + send_at)
          elif now < cutoff:
              send_at = (now + timedelta(minutes=2)).isoformat()
              print("WARNING: this run started after " + str(TARGET_HOUR) + ":00 Pacific.")
              print("Still inside the grace window, so sending now instead: " + send_at)
          else:
              print("This run started after " + str(CUTOFF_HOUR) + ":00 Pacific, too late to be a morning email.")
              print("Skipping today rather than dribbling it out midday. Check the Actions queue.")
              sys.exit(0)

          # Don't send twice. Guards against manual re-runs and duplicate triggers.
          try:
              req = urllib.request.Request(API, headers=headers, method="GET")
              with urllib.request.urlopen(req, timeout=30) as r:
                  existing = json.loads(r.read().decode("utf-8")).get("broadcasts", [])
              if any((b.get("subject") or "").strip() == subject for b in existing):
                  print("A broadcast named '" + subject + "' already exists. Nothing to do.")
                  sys.exit(0)
              print("No existing broadcast for today. Creating one.")
          except Exception as e:
              # A failed lookup should not cost a day's email. Proceed, but say so loudly.
              print("WARNING: could not check for an existing broadcast (" + str(e) + ").")
              print("Proceeding anyway. If the list gets this twice, that is why.")

          content = (
              '<p><a href="https://10everyday.com/e">https://10everyday.com/e</a></p>'
              '<p>Ten questions. About three minutes.</p>'
              '<p>Matt</p>'
          )

          payload = {
              "subject": subject,
              "content": content,
              "description": "Daily automated send",
              "public": True,
              "send_at": send_at,
          }

          req = urllib.request.Request(
              API,
              data=json.dumps(payload).encode("utf-8"),
              headers=headers,
              method="POST",
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = json.loads(r.read().decode("utf-8"))
                  bid = body.get("broadcast", {}).get("id")
                  print("Scheduled. Subject: " + subject)
                  print("Sends at: " + send_at)
                  print("Kit broadcast id: " + str(bid))
          except urllib.error.HTTPError as e:
              print("Kit returned an error: " + str(e.code))
              print(e.read().decode("utf-8"))
              sys.exit(1)
          PY

