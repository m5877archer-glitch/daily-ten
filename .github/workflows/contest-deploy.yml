name: Deploy contest Worker

# Puts the monthly contest backend (contest/worker.js) on Cloudflare at
# https://tenevery-contest.m5877archer.workers.dev and makes sure its D1
# database exists with the tables from contest/schema.sql. Safe to rerun.
#
# Needs a Cloudflare API token that can edit Workers and D1. It uses the
# CF_WORKERS_TOKEN secret if you add one, otherwise it tries CF_API_TOKEN.

on:
  push:
    branches: [main]
    paths: ["contest/**", ".github/workflows/contest-deploy.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 548962cab0a1c41df6c1579dbe54006f
      CI: "true"
    defaults:
      run:
        working-directory: contest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install --no-save --no-audit --no-fund wrangler@3

      - name: Check the token
        run: |
          npx wrangler whoami 2>&1 | tee -a ../deploy-log.txt
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | tee -a ../deploy-log.txt
          echo | tee -a ../deploy-log.txt

      - name: Find or create the database
        run: |
          exec > >(tee -a ../deploy-log.txt) 2>&1
          find_db() {
            npx wrangler d1 list --json | python3 -c 'import json,sys
          for d in json.load(sys.stdin):
              if d.get("name") == "tenevery-contest": print(d["uuid"])'
          }
          DBID=$(find_db || true)
          if [ -z "$DBID" ]; then
            npx wrangler d1 create tenevery-contest
            DBID=$(find_db)
          fi
          test -n "$DBID"
          echo "Database: $DBID"
          cat > wrangler.toml <<EOF
          name = "tenevery-contest"
          main = "worker.js"
          compatibility_date = "2024-09-01"
          workers_dev = true

          [[d1_databases]]
          binding = "DB"
          database_name = "tenevery-contest"
          database_id = "$DBID"
          EOF

      - name: Create tables
        run: npx wrangler d1 execute tenevery-contest --remote --file schema.sql --yes 2>&1 | tee -a ../deploy-log.txt; exit ${PIPESTATUS[0]}

      - name: Deploy
        run: npx wrangler deploy 2>&1 | tee -a ../deploy-log.txt; exit ${PIPESTATUS[0]}

      - name: Smoke test
        run: |
          sleep 10
          curl -fsS "https://tenevery-contest.m5877archer.workers.dev/board?month=2026-11" | head -c 300

      # Saves the log to the deploy-log branch so problems can be read
      # without opening the Actions page.
      - name: Save log
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir logbr && cd logbr && git init -q
          git config user.name "10everyday-bot"; git config user.email "hello@10everyday.com"
          git checkout -q --orphan deploy-log
          cp ../deploy-log.txt . 2>/dev/null || echo "no log" > deploy-log.txt
          sed -i "s/$CLOUDFLARE_API_TOKEN/[token]/g" deploy-log.txt || true
          git add . && git commit -qm "Contest deploy log $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:deploy-log
